name: Release checks
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: emulator-only-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-toki-matgo.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_DATABASE_URL: https://demo-toki-matgo-default-rtdb.firebaseio.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-toki-matgo
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-toki-matgo.firebasestorage.app
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '123456789'
      NEXT_PUBLIC_FIREBASE_APP_ID: '1:123456789:web:test'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:firebase
      - run: npm run test:e2e
      - run: npm run build
        env:
          NEXT_DEPLOYMENT_ID: ci-release-check
      - run: npm run test:pwa
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7
